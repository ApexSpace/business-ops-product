<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Minimal Neutral gift card artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f1ec"/>
      <stop offset="50%" stop-color="#ebe6df"/>
      <stop offset="100%" stop-color="#ddd5cb"/>
    </linearGradient>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#cfc6ba" opacity="0.35"/>
      <circle cx="5" cy="4" r="0.6" fill="#bdb3a6" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#grain)"/>
  <rect x="72" y="72" width="816" height="456" rx="20" fill="none" stroke="#b7ad9f" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="96" y="96" width="768" height="408" rx="14" fill="rgba(255,255,255,0.28)"/>
  <line x1="160" y1="300" x2="800" y2="300" stroke="#b7ad9f" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="36" y="36" width="888" height="528" rx="28" fill="none" stroke="rgba(140,130,120,0.2)" stroke-width="2"/>
</svg>
